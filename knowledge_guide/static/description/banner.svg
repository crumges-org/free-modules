<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">

  <defs>
    <!-- Kameos brand gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </linearGradient>

    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B1916"/>
      <stop offset="100%" stop-color="#c91f1c"/>
    </linearGradient>

    <linearGradient id="redToOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B1916"/>
      <stop offset="100%" stop-color="#f0c4c3"/>
    </linearGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9B1916" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9B1916" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.4"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- Decorative red glow -->
  <circle cx="1100" cy="120" r="240" fill="url(#redGlow)"/>
  <circle cx="200" cy="600" r="180" fill="url(#redGlow)" opacity="0.5"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" fill="white">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/>
    <circle cx="400" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="600" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/>
    <circle cx="100" cy="600" r="2"/><circle cx="200" cy="600" r="2"/><circle cx="100" cy="700" r="2"/>
  </g>

  <!-- ============================================================ -->
  <!-- TOP LEFT: Kameos logo                                         -->
  <!-- ============================================================ -->

  <g transform="translate(80, 70)">
    <!-- White rounded card to make the dark logo visible on dark background -->
    <rect x="0" y="0" width="280" height="80" rx="14" fill="white"/>
    <!-- Logo embedded via relative href (resolved by Inkscape/browser at conversion time) -->
    <image x="20" y="14" width="240" height="52" preserveAspectRatio="xMidYMid meet" xlink:href="logo-kameos.webp" href="logo-kameos.webp"/>
  </g>

  <!-- ============================================================ -->
  <!-- LEFT SIDE: Title and tagline                                  -->
  <!-- ============================================================ -->

  <!-- Eyebrow -->
  <text x="80" y="225" font-size="16" font-weight="700" fill="#9B1916" letter-spacing="3">
    ODOO 19 MODULE
  </text>

  <!-- Title -->
  <text x="80" y="310" font-size="80" font-weight="800" fill="white" letter-spacing="-2">
    Knowledge
  </text>
  <text x="80" y="395" font-size="80" font-weight="800" fill="url(#redToOrange)" letter-spacing="-2">
    Guide
  </text>

  <!-- Tagline -->
  <text x="80" y="455" font-size="24" font-weight="400" fill="#cbd5e1">
    Build navigable user guides
  </text>
  <text x="80" y="488" font-size="24" font-weight="400" fill="#cbd5e1">
    and publish them on the web.
  </text>

  <!-- Feature pills (Kameos red) -->
  <g transform="translate(80, 545)" font-size="14" font-weight="600" fill="white">
    <g>
      <rect x="0" y="0" width="160" height="42" rx="21" fill="#9B1916"/>
      <text x="80" y="27" text-anchor="middle">Multi-page</text>
    </g>
    <g transform="translate(175, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="rgba(155, 25, 22, 0.25)" stroke="#9B1916" stroke-width="1.5"/>
      <text x="90" y="27" text-anchor="middle">Public sharing</text>
    </g>
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="rgba(155, 25, 22, 0.25)" stroke="#9B1916" stroke-width="1.5"/>
      <text x="85" y="27" text-anchor="middle">Click tracking</text>
    </g>
  </g>

  <!-- Bottom credit -->
  <text x="80" y="660" font-size="13" font-weight="400" fill="#94a3b8">
    Compatible Odoo 19  ·  LGPL-3  ·  by
  </text>
  <text x="290" y="660" font-size="13" font-weight="700" fill="#9B1916">
    Kameos
  </text>
  <text x="355" y="660" font-size="13" font-weight="400" fill="#94a3b8">
    Odoo integrator, Belgium
  </text>

  <!-- ============================================================ -->
  <!-- RIGHT SIDE: UI mockup with Kameos red accents                 -->
  <!-- ============================================================ -->

  <g transform="translate(720, 110)" filter="url(#cardShadow)">

    <!-- Sidebar card -->
    <g>
      <rect x="0" y="0" width="200" height="500" rx="14" fill="#ffffff"/>

      <!-- Book title in sidebar -->
      <rect x="16" y="20" width="32" height="32" rx="8" fill="#0f0f1a"/>
      <text x="32" y="42" text-anchor="middle" font-size="18" fill="white">📘</text>
      <text x="58" y="35" font-size="14" font-weight="700" fill="#0f0f1a">User Guide</text>
      <text x="58" y="50" font-size="11" font-weight="400" fill="#636980">5 pages</text>

      <!-- Search bar -->
      <rect x="16" y="70" width="168" height="32" rx="6" fill="#f1f3f7"/>
      <text x="28" y="90" font-size="11" fill="#94a3b8">🔍  Search...</text>

      <!-- Category 1: expanded -->
      <rect x="16" y="118" width="168" height="22" rx="4" fill="#f8f9fc"/>
      <text x="24" y="134" font-size="11" font-weight="700" fill="#4a5068">▼  Getting Started</text>

      <!-- Active page (Kameos red) -->
      <rect x="22" y="146" width="156" height="26" rx="4" fill="#fef2f2"/>
      <rect x="22" y="146" width="3" height="26" fill="#9B1916"/>
      <circle cx="40" cy="159" r="3" fill="#9B1916"/>
      <text x="50" y="163" font-size="11" font-weight="600" fill="#9B1916">Welcome</text>

      <!-- Other page -->
      <rect x="22" y="178" width="156" height="26" rx="4" fill="transparent"/>
      <circle cx="34" cy="191" r="3" fill="#cbd5e1"/>
      <text x="44" y="195" font-size="11" font-weight="400" fill="#4a5068">Navigation</text>

      <!-- Category 2: expanded -->
      <rect x="16" y="220" width="168" height="22" rx="4" fill="#f8f9fc"/>
      <text x="24" y="236" font-size="11" font-weight="700" fill="#4a5068">▼  Features</text>

      <text x="44" y="265" font-size="11" font-weight="400" fill="#4a5068">Books</text>
      <text x="44" y="290" font-size="11" font-weight="400" fill="#4a5068">Public sharing</text>
      <text x="44" y="315" font-size="11" font-weight="400" fill="#4a5068">Tracking</text>

      <!-- Category 3: collapsed -->
      <rect x="16" y="340" width="168" height="22" rx="4" fill="#f8f9fc"/>
      <text x="24" y="356" font-size="11" font-weight="700" fill="#4a5068">▶  Developers</text>

      <!-- Footer in sidebar -->
      <rect x="16" y="450" width="168" height="34" rx="6" fill="#f8f9fc"/>
      <text x="100" y="471" text-anchor="middle" font-size="10" font-weight="500" fill="#636980">
        Powered by Knowledge Guide
      </text>
    </g>

    <!-- Content card -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="320" height="500" rx="14" fill="#ffffff"/>

      <!-- Category badge (Kameos red) -->
      <rect x="24" y="24" width="120" height="24" rx="12" fill="#fef2f2"/>
      <text x="84" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#9B1916">
        🏷  Getting Started
      </text>

      <!-- Title -->
      <text x="24" y="84" font-size="28" font-weight="800" fill="#0f0f1a">Welcome</text>

      <!-- Divider -->
      <line x1="24" y1="100" x2="296" y2="100" stroke="#e2e5ec" stroke-width="1"/>

      <!-- Body lines -->
      <rect x="24" y="118" width="270" height="9" rx="4" fill="#e2e5ec"/>
      <rect x="24" y="135" width="240" height="9" rx="4" fill="#e2e5ec"/>
      <rect x="24" y="152" width="260" height="9" rx="4" fill="#e2e5ec"/>

      <!-- Subheading -->
      <rect x="24" y="180" width="180" height="11" rx="4" fill="#0f0f1a"/>

      <rect x="24" y="208" width="270" height="9" rx="4" fill="#e2e5ec"/>
      <rect x="24" y="225" width="240" height="9" rx="4" fill="#e2e5ec"/>
      <rect x="24" y="242" width="220" height="9" rx="4" fill="#e2e5ec"/>

      <!-- Bullet list with Kameos red dots -->
      <g>
        <circle cx="32" cy="278" r="3" fill="#9B1916"/>
        <rect x="44" y="274" width="200" height="9" rx="4" fill="#e2e5ec"/>

        <circle cx="32" cy="298" r="3" fill="#9B1916"/>
        <rect x="44" y="294" width="220" height="9" rx="4" fill="#e2e5ec"/>

        <circle cx="32" cy="318" r="3" fill="#9B1916"/>
        <rect x="44" y="314" width="180" height="9" rx="4" fill="#e2e5ec"/>

        <circle cx="32" cy="338" r="3" fill="#9B1916"/>
        <rect x="44" y="334" width="240" height="9" rx="4" fill="#e2e5ec"/>
      </g>

      <!-- Info alert (Kameos red theme) -->
      <rect x="24" y="370" width="272" height="62" rx="8" fill="#fef2f2" stroke="#f0c4c3" stroke-width="1"/>
      <text x="40" y="395" font-size="14" fill="#9B1916">ℹ</text>
      <text x="58" y="395" font-size="11" font-weight="700" fill="#9B1916">Tip</text>
      <rect x="58" y="404" width="220" height="7" rx="3" fill="#f0c4c3"/>
      <rect x="58" y="416" width="180" height="7" rx="3" fill="#f0c4c3"/>

      <!-- Pagination -->
      <rect x="24" y="450" width="120" height="32" rx="6" fill="#f1f3f7"/>
      <text x="84" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="#4a5068">← Previous</text>

      <rect x="176" y="450" width="120" height="32" rx="6" fill="#9B1916"/>
      <text x="236" y="470" text-anchor="middle" font-size="11" font-weight="600" fill="white">Next →</text>
    </g>

  </g>

</svg>
