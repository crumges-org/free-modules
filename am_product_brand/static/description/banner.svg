<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 560">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A3347;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1024" height="560" fill="url(#bgGradient)"/>

  <!-- Decorative circles in background -->
  <circle cx="900" cy="100" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="850" cy="450" r="150" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="500" r="100" fill="rgba(255,255,255,0.03)"/>

  <!-- Left side - Text content -->
  <g transform="translate(60, 80)">
    <!-- Badges -->
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#28a745"/>
    <text x="60" y="24" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Odoo 18</text>

    <rect x="135" y="0" width="80" height="36" rx="18" fill="#17a2b8"/>
    <text x="175" y="24" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">FREE</text>

    <!-- Module name -->
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="48" fill="white" font-weight="bold">POS Product</text>
    <text x="0" y="145" font-family="Arial, sans-serif" font-size="48" fill="white" font-weight="bold">Brand</text>

    <!-- Subtitle -->
    <text x="0" y="190" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.8)">Organize &amp; filter products by brand in Point of Sale</text>

    <!-- Feature list -->
    <g transform="translate(0, 230)">
      <circle cx="12" cy="12" r="10" fill="#28a745"/>
      <text x="10" y="17" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">&#10003;</text>
      <text x="32" y="17" font-family="Arial, sans-serif" font-size="16" fill="white">Create and manage product brands</text>
    </g>
    <g transform="translate(0, 270)">
      <circle cx="12" cy="12" r="10" fill="#28a745"/>
      <text x="10" y="17" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">&#10003;</text>
      <text x="32" y="17" font-family="Arial, sans-serif" font-size="16" fill="white">Filter products by brand in POS</text>
    </g>
    <g transform="translate(0, 310)">
      <circle cx="12" cy="12" r="10" fill="#28a745"/>
      <text x="10" y="17" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">&#10003;</text>
      <text x="32" y="17" font-family="Arial, sans-serif" font-size="16" fill="white">Configure brands per POS point</text>
    </g>
    <g transform="translate(0, 350)">
      <circle cx="12" cy="12" r="10" fill="#28a745"/>
      <text x="10" y="17" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">&#10003;</text>
      <text x="32" y="17" font-family="Arial, sans-serif" font-size="16" fill="white">Display brand logos for easy selection</text>
    </g>

    <!-- Price badge -->
    <g transform="translate(0, 410)">
      <rect x="0" y="0" width="140" height="50" rx="8" fill="white"/>
      <text x="70" y="22" font-family="Arial, sans-serif" font-size="12" fill="#714B67" text-anchor="middle">PRICE</text>
      <text x="70" y="42" font-family="Arial, sans-serif" font-size="20" fill="#28a745" text-anchor="middle" font-weight="bold">FREE</text>
    </g>
  </g>

  <!-- Right side - Preview card -->
  <g transform="translate(540, 60)">
    <!-- White card with shadow effect -->
    <rect x="0" y="0" width="420" height="440" rx="16" fill="white" filter="drop-shadow(0 10px 30px rgba(0,0,0,0.3))"/>

    <!-- Card header (macOS style) -->
    <rect x="0" y="0" width="420" height="50" rx="16" fill="#f8f9fa"/>
    <rect x="0" y="35" width="420" height="15" fill="#f8f9fa"/>
    <circle cx="30" cy="25" r="8" fill="#dc3545"/>
    <circle cx="55" cy="25" r="8" fill="#ffc107"/>
    <circle cx="80" cy="25" r="8" fill="#28a745"/>
    <text x="210" y="30" font-family="Arial, sans-serif" font-size="14" fill="#714B67" text-anchor="middle" font-weight="bold">Point of Sale - Brand Filter</text>

    <!-- POS Interface mockup -->
    <!-- Brand selector area -->
    <rect x="20" y="70" width="380" height="60" rx="8" fill="#f8f9fa"/>
    <text x="30" y="90" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">Select Brand:</text>

    <!-- Brand buttons -->
    <rect x="30" y="100" width="70" height="24" rx="12" fill="#714B67"/>
    <text x="65" y="116" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">All Brands</text>

    <rect x="110" y="100" width="60" height="24" rx="12" fill="#28a745"/>
    <text x="140" y="116" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">Apple</text>

    <rect x="180" y="100" width="70" height="24" rx="12" fill="rgba(113,75,103,0.2)"/>
    <text x="215" y="116" font-family="Arial, sans-serif" font-size="10" fill="#714B67" text-anchor="middle">Samsung</text>

    <rect x="260" y="100" width="55" height="24" rx="12" fill="rgba(113,75,103,0.2)"/>
    <text x="287" y="116" font-family="Arial, sans-serif" font-size="10" fill="#714B67" text-anchor="middle">Sony</text>

    <rect x="325" y="100" width="65" height="24" rx="12" fill="rgba(113,75,103,0.2)"/>
    <text x="357" y="116" font-family="Arial, sans-serif" font-size="10" fill="#714B67" text-anchor="middle">LG</text>

    <!-- Product grid -->
    <g transform="translate(20, 145)">
      <!-- Product 1 -->
      <rect x="0" y="0" width="115" height="130" rx="8" fill="#f8f9fa" stroke="#28a745" stroke-width="2"/>
      <rect x="10" y="10" width="95" height="70" rx="4" fill="#e9ecef"/>
      <text x="57" y="50" font-family="Arial, sans-serif" font-size="24" fill="#6c757d" text-anchor="middle">iPhone</text>
      <text x="57" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">iPhone 15 Pro</text>
      <text x="57" y="118" font-family="Arial, sans-serif" font-size="12" fill="#28a745" text-anchor="middle" font-weight="bold">$999.00</text>

      <!-- Product 2 -->
      <rect x="125" y="0" width="115" height="130" rx="8" fill="#f8f9fa" stroke="#28a745" stroke-width="2"/>
      <rect x="135" y="10" width="95" height="70" rx="4" fill="#e9ecef"/>
      <text x="182" y="50" font-family="Arial, sans-serif" font-size="24" fill="#6c757d" text-anchor="middle">iPad</text>
      <text x="182" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">iPad Air</text>
      <text x="182" y="118" font-family="Arial, sans-serif" font-size="12" fill="#28a745" text-anchor="middle" font-weight="bold">$599.00</text>

      <!-- Product 3 -->
      <rect x="250" y="0" width="115" height="130" rx="8" fill="#f8f9fa" stroke="#28a745" stroke-width="2"/>
      <rect x="260" y="10" width="95" height="70" rx="4" fill="#e9ecef"/>
      <text x="307" y="50" font-family="Arial, sans-serif" font-size="24" fill="#6c757d" text-anchor="middle">Mac</text>
      <text x="307" y="100" font-family="Arial, sans-serif" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">MacBook Pro</text>
      <text x="307" y="118" font-family="Arial, sans-serif" font-size="12" fill="#28a745" text-anchor="middle" font-weight="bold">$1,299.00</text>
    </g>

    <!-- Stats row -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="115" height="55" rx="8" fill="#f8f9fa"/>
      <text x="57" y="22" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Total Brands</text>
      <text x="57" y="44" font-family="Arial, sans-serif" font-size="20" fill="#714B67" text-anchor="middle" font-weight="bold">12</text>

      <rect x="125" y="0" width="115" height="55" rx="8" fill="#f8f9fa"/>
      <text x="182" y="22" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Products</text>
      <text x="182" y="44" font-family="Arial, sans-serif" font-size="20" fill="#28a745" text-anchor="middle" font-weight="bold">248</text>

      <rect x="250" y="0" width="115" height="55" rx="8" fill="#f8f9fa"/>
      <text x="307" y="22" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Filtered</text>
      <text x="307" y="44" font-family="Arial, sans-serif" font-size="20" fill="#17a2b8" text-anchor="middle" font-weight="bold">45</text>
    </g>

    <!-- Bottom bar -->
    <g transform="translate(20, 360)">
      <rect x="0" y="0" width="175" height="60" rx="8" fill="#714B67"/>
      <text x="87" y="25" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Brand:</text>
      <text x="87" y="48" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Apple</text>

      <rect x="190" y="0" width="175" height="60" rx="8" fill="#28a745"/>
      <text x="277" y="38" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Filter Products</text>
    </g>
  </g>
</svg>
