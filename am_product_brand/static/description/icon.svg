<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Purple background -->
  <rect width="128" height="128" rx="16" fill="#714B67"/>

  <!-- White card/POS screen -->
  <rect x="20" y="20" width="88" height="88" rx="8" fill="white"/>

  <!-- POS screen header -->
  <rect x="20" y="20" width="88" height="20" rx="8" fill="#28a745"/>
  <rect x="20" y="32" width="88" height="8" fill="#28a745"/>

  <!-- Brand tag icon -->
  <g transform="translate(38, 52)">
    <!-- Tag shape -->
    <path d="M0 8 L0 40 L32 40 L52 24 L32 8 Z" fill="#714B67"/>
    <!-- Tag hole -->
    <circle cx="10" cy="24" r="5" fill="white"/>
  </g>

  <!-- Filter lines representing brand filtering -->
  <rect x="30" y="96" width="20" height="4" rx="2" fill="#e9ecef"/>
  <rect x="54" y="96" width="20" height="4" rx="2" fill="#17a2b8"/>
  <rect x="78" y="96" width="20" height="4" rx="2" fill="#e9ecef"/>

  <!-- Small checkmark badge -->
  <circle cx="98" cy="72" r="14" fill="#28a745"/>
  <path d="M91 72 L96 77 L105 66" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
